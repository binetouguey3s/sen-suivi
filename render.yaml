# API Django sur Render (offre gratuite) — voir DEPLOIEMENT.md.
# Render lit ce fichier dans « New > Blueprint ». Les valeurs marquées
# sync: false sont demandées à la création et ne sont jamais écrites ici.
services:
  - type: web
    name: sen-suivi-api
    runtime: docker
    plan: free
    # Francfort : la région Render la plus proche de Dakar, comme la base Neon
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/sante
    autoDeploy: true
    branch: main
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_CLE
        sync: false
      # Pas de n8n en hébergement gratuit : Django envoie lui-même les notifications
      - key: N8N_WEBHOOK_URL
        value: ""
      # Clé interne des rappels (tâche planifiée GitHub Actions « Rappels »)
      - key: N8N_API_KEY
        sync: false
      - key: GUNICORN_WORKERS
        value: "2"
      # Un réveil du microservice IA peut prendre une minute
      - key: AI_SERVICE_DELAI_SECONDES
        value: "60"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: STOCKAGE_BUCKET
        sync: false
      - key: STOCKAGE_URL
        sync: false
      - key: STOCKAGE_CLE_ACCES
        sync: false
      - key: STOCKAGE_CLE_SECRETE
        sync: false
      - key: STOCKAGE_REGION
        sync: false
