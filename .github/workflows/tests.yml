# Vérifie chaque envoi sur GitHub avant un déploiement : tests du back-end et
# du microservice IA, construction de production du front-end.
name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sensuivi
          POSTGRES_USER: sensuivi
          POSTGRES_PASSWORD: sensuivi
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: cle-de-test-uniquement-pour-l-integration-continue
      POSTGRES_DB: sensuivi
      POSTGRES_USER: sensuivi
      POSTGRES_PASSWORD: sensuivi
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test --noinput

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    # Même configuration qu'en ligne (Render) : sans PyTorch, index dans un
    # dossier temporaire (/data n'est pas accessible sur les machines GitHub)
    env:
      EMBEDDING_FOURNISSEUR: mistral
      CHROMA_PERSIST_DIR: /tmp/chroma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-render.txt
      - run: pip install -r requirements-render.txt pytest==8.3.4
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/construire.mjs
        env:
          API_BASE_URL: https://sen-suivi-api.onrender.com/api
