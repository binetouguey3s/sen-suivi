# Publie le dossier ai-service/ sur le Space Hugging Face à chaque mise à jour
# de main. À régler une fois dans GitHub (Settings > Secrets and variables > Actions) :
#   - secret   HF_TOKEN : jeton Hugging Face avec le droit d'écriture
#   - variable HF_SPACE : nom du Space, ex. Binetu/sen-suivi-ia
name: Déployer le service IA

on:
  push:
    branches: [main]
    paths: ['ai-service/**']
  workflow_dispatch:

jobs:
  publier:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer ai-service sur Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd ai-service
          git init -q -b main
          git config user.name "Sen Suivi"
          git config user.email "deploiement@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploiement depuis GitHub (${GITHUB_SHA::7})"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
