<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <!-- Seul script inline du projet : pose le thème avant le premier rendu,
         pour éviter un éclair de thème clair. Même logique que ThemeService
         (clé ss_theme, « systeme » par défaut). -->
    <script>
      (function () {
        var choix;
        try { choix = localStorage.getItem('ss_theme'); } catch (e) {}
        if (choix !== 'clair' && choix !== 'sombre') {
          choix = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair';
        }
        document.documentElement.setAttribute('data-theme', choix);
      })();
    </script>
    <title>Sen Suivi</title>
    <base href="/">
    <link rel="icon" type="image/png" href="/logo-sen-suivi.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Couleur de la barre d'état mobile avant le démarrage d'Angular : une
         balise HTML ne peut pas lire var(--ss-*), ces valeurs suivent --ss-fond
         de _themes.scss. ThemeService les aligne ensuite sur le thème choisi. -->
    <meta name="theme-color" content="#eef5f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e2739" media="(prefers-color-scheme: dark)">
  </head>
  <body>
    <ss-root></ss-root>
  </body>
</html>
