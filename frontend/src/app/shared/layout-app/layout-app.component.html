<div class="layout-app">
  <aside class="layout-app__sidebar">
    <img class="layout-app__logo" src="/logo-sen-suivi.png" alt="Sen Suivi" />

    <nav class="layout-app__nav">
      @for (lien of liens; track lien.route) {
        @if (lien.disponible) {
          <a
            class="layout-app__lien"
            [routerLink]="lien.route"
            routerLinkActive="layout-app__lien--actif"
            [routerLinkActiveOptions]="{ exact: lien.route === '/app' }"
          >
            <ss-icon [nom]="lien.icone" />
            {{ lien.libelle }}
          </a>
        } @else {
          <span class="layout-app__lien layout-app__lien--a-venir" title="Écran à venir">
            <ss-icon [nom]="lien.icone" />
            {{ lien.libelle }}
          </span>
        }
      }
    </nav>

    <div class="layout-app__profil">
      <span class="layout-app__avatar">{{ initiales() }}</span>
      <div>
        <p class="layout-app__profil-nom">{{ auth.prenom() }} {{ auth.nom() }}</p>
      </div>
    </div>
  </aside>

  <div class="layout-app__zone">
    <header class="layout-app__topbar-mobile">
      <img class="layout-app__logo layout-app__logo--mobile" src="/logo-sen-suivi.png" alt="Sen Suivi" />
      <span class="layout-app__avatar layout-app__avatar--mobile">{{ initiales() }}</span>
    </header>

    <main class="layout-app__contenu">
      <router-outlet />

      <button type="button" class="layout-app__urgence" (click)="modaleUrgenceOuverte.set(true)">
        <ss-icon nom="telephone" taille="sm" /> Besoin d'aide tout de suite
      </button>
    </main>
  </div>

  <button type="button" class="layout-app__chat" title="Chatbot — bientôt disponible">
    <ss-icon nom="chat" taille="lg" />
    <span class="layout-app__chat-point" aria-hidden="true"></span>
  </button>

  <ss-modal-urgence [(ouverte)]="modaleUrgenceOuverte" />

  <nav class="layout-app__nav-mobile">
    <a class="layout-app__lien-mobile" routerLink="/app" routerLinkActive="layout-app__lien-mobile--actif" [routerLinkActiveOptions]="{ exact: true }">
      <ss-icon nom="accueil" />
      <span>Accueil</span>
    </a>
    <a class="layout-app__lien-mobile" routerLink="/app/journal" routerLinkActive="layout-app__lien-mobile--actif">
      <ss-icon nom="journal" />
      <span>Journal</span>
    </a>
    <span class="layout-app__nav-mobile-espace" aria-hidden="true"></span>
    <a class="layout-app__lien-mobile" routerLink="/ressources">
      <ss-icon nom="ressources" />
      <span>Ressources</span>
    </a>
    <span class="layout-app__lien-mobile layout-app__lien-mobile--a-venir">
      <ss-icon nom="parametres" />
      <span>Réglages</span>
    </span>
  </nav>
</div>
